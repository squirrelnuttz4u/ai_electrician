server {
    listen 80;
    server_name _;
    client_max_body_size 200M;   # allow large schematic PDFs

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API + streaming chat to the backend service.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;      # vision extraction / long answers
        proxy_buffering off;           # stream chat tokens through immediately
    }

    # SPA fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
